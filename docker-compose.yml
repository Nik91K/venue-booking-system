services:
  web:
    build:
      context: .
      target: development
    ports:
      - "8000:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DB_TYPE: ${DB_TYPE:-postgres}
      DB_HOST: db
      DB_PORT: ${DB_PORT:-5432}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_DATABASE: ${DB_DATABASE:-venue_booking}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-key}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-secret}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-900}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-604800}
      UPLOADS_ESTABLISHMENTS_PATH: ${UPLOADS_ESTABLISHMENTS_PATH:-uploads/establishments}
      UPLOADS_PATH: ${UPLOADS_PATH:-uploads}
      MINIMUM_COMMENTS: ${MINIMUM_COMMENTS:-3}
      GLOBAL_AVERAGE_RATING: ${GLOBAL_AVERAGE_RATING:-1}
    volumes:
      - ./src:/usr/src/app/src
      - ./uploads:/usr/src/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - appnet
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_DATABASE:-venue_booking}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - appnet
    restart: unless-stopped

  swagger-ui:
    image: swaggerapi/swagger-ui:v5.19.0 
    ports:
      - "8081:8080"
    environment:
      API_URL: http://localhost:8000/api-json
    depends_on:
      - web

networks:
  appnet:
 
volumes:
  db_data:
