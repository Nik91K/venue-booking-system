services:
  web:
    image: ghcr.io/notnikbtw/venue-booking-backend:latest
    ports:
      - "8000:3000"
    environment:
      NODE_ENV: production
      DB_TYPE: ${DB_TYPE}
      DB_HOST: db
      DB_PORT: ${DB_PORT}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}
      UPLOADS_ESTABLISHMENTS_PATH: ${UPLOADS_ESTABLISHMENTS_PATH}
      UPLOADS_PATH: ${UPLOADS_PATH}
      MINIMUM_COMMENTS: ${MINIMUM_COMMENTS}
      GLOBAL_AVERAGE_RATING: ${GLOBAL_AVERAGE_RATING}
    volumes:
      - ./uploads:/usr/src/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - appnet
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - appnet
    restart: unless-stopped

  watchtower:
    image: containrrr/watchtower
    environment:
      WATCHTOWER_REGISTRY_CREDENTIALS: '{"ghcr.io": {"username": "${GHCR_USERNAME}", "password": "${GHCR_PAT}"}}'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 60 --label-enable --cleanup
    restart: unless-stopped

networks:
  appnet:
 
volumes:
  db_data:
